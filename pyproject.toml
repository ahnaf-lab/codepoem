[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codepoem"
version = "0.1.0"
description = "Turn a git diff into a short, deterministic poem"
requires-python = ">=3.10"

[project.scripts]
codepoem = "codepoem.cli:main"

[tool.setuptools]
packages = ["codepoem"]
